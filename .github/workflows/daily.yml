name: Market Breadth diário

# O GitHub só aceita horário em UTC. Os dois horários abaixo cobrem o horário de
# inverno e o de verão de Berlim; o passo "Checar horário" deixa rodar só aquele
# que cai às 7h30 em Berlim, para o e-mail chegar perto das 8h.
on:
  schedule:
    - cron: "30 5 * * *"   # 06:30 inverno (CET) | 07:30 verão (CEST)
    - cron: "30 6 * * *"   # 07:30 inverno (CET) | 08:30 verão (CEST)
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write           # para gravar docs/ (dashboard + histórico) de volta no repositório

jobs:
  breadth:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checar horário de Berlim
        id: tz
        run: |
          H=$(TZ=Europe/Berlin date +%H)
          echo "Hora em Berlim: $H"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$H" = "07" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.tz.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.tz.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        if: steps.tz.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Calcular breadth, gerar dashboard e enviar e-mail
        if: steps.tz.outputs.go == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python market_breadth.py

      - name: Gravar dashboard e histórico no repositório
        if: steps.tz.outputs.go == 'true'
        run: |
          git config user.name  "market-breadth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git commit -m "Atualização diária $(date -u +%Y-%m-%d)" || echo "nada novo"
          git push
